# lzt-settings-framework 功能开关配置
# ------------------------------------------------------------
# 本文件仅声明各功能的启用状态，是这些开关的唯一声明处；
# 它自身不含任何构建逻辑。
# 构建流程读取本文件，把下列开关映射到编译期常量后再编译/打包。
#
# 语法：<开关名> = <true|false>   # 行尾注释（# 之后忽略）
# 分组标题只作可读性组织，不参与语义。
# ------------------------------------------------------------

[components]
# 组件补丁（见 jni/components/README.md）

# 强制所有设备字形渲染缓存为 2048：小屏原按最小边选 512/1024 会字符缺失
glyph_cache_size = true

# 图鉴翻页/切换条目时主动清+重建字形缓存：避免复用上一页脏缓存导致字符异常
glyph_cache_flush = true

[features]
# 语言与本地化相关开关

# News 页本地化短码兜底：自定义语言不在引擎白名单时空键改写为短码
news_localization = true

# CDN-json 快速读取通道：把 LANGUAGETYPES.json 纳入语言表来源（开发期提速用）
fast_read_channel = false

# 空白语言页回退：无语言来源或仅一种语言时是否仍创建语言 Tab
empty_lang_page_fallback = false